<!-- =========================================================
     JAVASCRIPT INTEGRADO COM FIREBASE
========================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAPmBG8YkkKF1gJabX5__ZkMEmIQ72LyGo",
        authDomain: "climajanas.firebaseapp.com",
        databaseURL: "https://climajanas-default-rtdb.firebaseio.com",
        projectId: "climajanas",
        storageBucket: "climajanas.firebasestorage.app",
        messagingSenderId: "159219853939",
        appId: "1:159219853939:web:c89231df302d506436d806"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Array que armazenará os dados vindos do Firebase
    let dadosMeteorologicos = [];
    let dadosExibidos = [];

    /*
    ============================================================
    ELEMENTOS DA PÁGINA
    ============================================================
    */
    const periodo = document.getElementById("periodo");
    const dataInicial = document.getElementById("dataInicial");
    const dataFinal = document.getElementById("dataFinal");
    const btnFiltrar = document.getElementById("btnFiltrar");
    const tabela = document.getElementById("firebase-history");
    const resultInfo = document.getElementById("result-info");

    /*
    ============================================================
    CONVERSÃO DE TIMESTAMP
    Aceita Unix epoch em segundos, em milissegundos, ou millis()
    do ESP32 (fallback com datas sintéticas).
    ============================================================
    */
    function timestampParaMs(ts, idx, total) {
        const n = Number(ts);
        // Se for >= 1e9, é Unix epoch (segundos ou ms)
        if (n >= 1e9) {
            return n < 1e12 ? n * 1000 : n;
        }
        // Fallback: millis() do ESP32 → gera datas sintéticas
        // Distribui as leituras no tempo a partir de agora, com 5 min entre cada
        const agora = Date.now();
        const intervalo = 5 * 60 * 1000; // 5 minutos
        return agora - (total - 1 - idx) * intervalo;
    }

    /*
    ============================================================
    BUSCA DADOS DO FIREBASE EM TEMPO REAL
    ============================================================
    */
    const leiturasRef = ref(db, 'leituras');
    onValue(leiturasRef, (snapshot) => {
        const data = snapshot.val();

        if (!data) {
            renderizarTabela([]);
            return;
        }

        const chaves = Object.keys(data);
        const total = chaves.length;

        dadosMeteorologicos = chaves.map((key, idx) => {
            const item = data[key];

            return {
                data: timestampParaMs(item.timestamp ?? item.data, idx, total),
                temperatura: Number(item.temperatura ?? 0),
                umidade: Number(item.umidade ?? 0),
                pressao: Number(item.pressao ?? 0),
                chuva: Number(item.chuva ?? 0)   // valor por leitura (mm)
            };
        });

        aplicarFiltro();
    });

    /*
    ============================================================
    HABILITAR / DESABILITAR DATAS PERSONALIZADAS
    ============================================================
    */
    periodo.addEventListener("change", function () {
        if (periodo.value === "personalizado") {
            dataInicial.disabled = false;
            dataFinal.disabled = false;
        } else {
            dataInicial.disabled = true;
            dataFinal.disabled = true;
            dataInicial.value = "";
            dataFinal.value = "";
        }
    });

    /*
    ============================================================
    DETERMINAR O STATUS DO REGISTRO
    A chuva já vem como valor por leitura (mm naquela hora),
    então usamos ela direto.
    ============================================================
    */
    function determinarStatus(dado) {
        const chuva = Number(dado.chuva ?? 0);

        if (chuva >= 1.0) {
            return { texto: "CHUVOSO", classe: "bg-blue-100 text-blue-700" };
        }
        if (chuva > 0) {
            return { texto: "GAROA", classe: "bg-cyan-100 text-cyan-700" };
        }
        if (Number(dado.temperatura) >= 30) {
            return { texto: "QUENTE", classe: "bg-orange-100 text-orange-700" };
        }
        if (Number(dado.umidade) >= 85) {
            return { texto: "ÚMIDO", classe: "bg-blue-100 text-blue-700" };
        }
        return { texto: "ESTÁVEL", classe: "bg-green-100 text-green-700" };
    }

    /*
    ============================================================
    FORMATAR DATA
    ============================================================
    */
    function formatarData(dataMs) {
        const dataObj = new Date(dataMs);
        return dataObj.toLocaleString("pt-BR", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    /*
    ============================================================
    FORMATAR NÚMEROS
    - Se for inteiro, mostra sem casas decimais
    - Caso contrário, mostra com N casas
    ============================================================
    */
    function formatarNumero(valor, casas = 1) {
        const n = Number(valor);
        if (!isFinite(n)) return "—";
        if (Number.isInteger(n)) return String(n);
        return n.toFixed(casas);
    }

    /*
    ============================================================
    RENDERIZAR TABELA
    A coluna "Chuva (mm)" mostra o valor por leitura direto.
    ============================================================
    */
    function renderizarTabela(dados) {
        dadosExibidos = [...dados];
        tabela.innerHTML = "";

        if (dados.length === 0) {
            tabela.innerHTML = `
                <tr>
                    <td colspan="6" class="p-10 text-center text-on-surface-variant">
                        <div class="flex flex-col items-center gap-3">
                            <span class="material-symbols-outlined text-4xl">cloud_off</span>
                            <p class="font-bold">Nenhum dado encontrado</p>
                            <p class="text-sm">Não existem registros para o período selecionado.</p>
                        </div>
                    </td>
                </tr>`;
            return;
        }

        // Ordena do mais recente para o mais antigo
        dados.sort((a, b) => b.data - a.data);

        dados.forEach(dado => {
            const status = determinarStatus(dado);
            const linha = document.createElement("tr");
            linha.className = "hover:bg-surface-container-low transition-colors";
            linha.innerHTML = `
                <td class="p-4 font-bold text-primary">${formatarData(dado.data)}</td>
                <td class="p-4 text-center">${formatarNumero(dado.temperatura, 1)}</td>
                <td class="p-4 text-center">${formatarNumero(dado.umidade, 0)}</td>
                <td class="p-4 text-center">${formatarNumero(dado.pressao, 2)}</td>
                <td class="p-4 text-center">${formatarNumero(dado.chuva, 1)}</td>
                <td class="p-4 text-center">
                    <span class="px-3 py-1 ${status.classe} rounded-full font-bold text-[10px]">
                        ${status.texto}
                    </span>
                </td>`;
            tabela.appendChild(linha);
        });
    }

    /*
    ============================================================
    APLICAR FILTRO
    ============================================================
    */
    function aplicarFiltro() {
        const agora = Date.now();
        let dadosFiltrados = [];

        if (periodo.value === "24h") {
            const limite = agora - (24 * 60 * 60 * 1000);
            dadosFiltrados = dadosMeteorologicos.filter(dado => dado.data >= limite);
        }
        else if (periodo.value === "7d") {
            const limite = agora - (7 * 24 * 60 * 60 * 1000);
            dadosFiltrados = dadosMeteorologicos.filter(dado => dado.data >= limite);
        }
        else if (periodo.value === "personalizado") {
            if (!dataInicial.value || !dataFinal.value) {
                resultInfo.textContent = "Selecione a data inicial e a data final.";
                resultInfo.className = "mt-4 text-sm text-red-600 font-bold";
                return;
            }

            const inicio = new Date(dataInicial.value + "T00:00:00").getTime();
            const fim = new Date(dataFinal.value + "T23:59:59").getTime();

            if (inicio > fim) {
                resultInfo.textContent = "A data inicial não pode ser posterior à data final.";
                resultInfo.className = "mt-4 text-sm text-red-600 font-bold";
                return;
            }

            dadosFiltrados = dadosMeteorologicos.filter(dado => {
                return dado.data >= inicio && dado.data <= fim;
            });
        }

        // Soma total de chuva no período (valor por leitura)
        const totalChuvaPeriodo = dadosFiltrados.reduce(
            (soma, d) => soma + Number(d.chuva ?? 0),
            0
        );

        renderizarTabela(dadosFiltrados);

        resultInfo.textContent =
            `${dadosFiltrados.length} registro(s) encontrado(s). ` +
            `Chuva acumulada no período: ${totalChuvaPeriodo.toFixed(1)} mm.`;

        resultInfo.className = "mt-4 text-sm text-on-surface-variant";
    }


    /*
    ============================================================
    EXPORTAÇÃO PDF E CSV
    ============================================================
    */

    function escaparCSV(valor) {
        const texto = String(valor ?? "").replace(/"/g, '""');
        return `"${texto}"`;
    }

    function nomeArquivoData() {
        const agora = new Date();
        const pad = n => String(n).padStart(2, "0");
        return `${agora.getFullYear()}-${pad(agora.getMonth() + 1)}-${pad(agora.getDate())}_${pad(agora.getHours())}-${pad(agora.getMinutes())}`;
    }

    function exportarCSV() {
        if (!dadosExibidos.length) {
            alert("Não há dados para exportar no período selecionado.");
            return;
        }

        const linhas = [
            ["Data/Hora", "Temperatura (°C)", "Umidade (%)", "Pressão (hPa)", "Chuva (mm)", "Status"],
            ...dadosExibidos.map(dado => {
                const status = determinarStatus(dado).texto;
                return [
                    formatarData(dado.data),
                    formatarNumero(dado.temperatura, 1),
                    formatarNumero(dado.umidade, 0),
                    formatarNumero(dado.pressao, 2),
                    formatarNumero(dado.chuva, 1),
                    status
                ];
            })
        ];

        const csv = "\uFEFF" + linhas.map(linha => linha.map(escaparCSV).join(";")).join("\r\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `ClimaJanauba_Historico_${nomeArquivoData()}.csv`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
    }

    function exportarPDF() {
        if (!dadosExibidos.length) {
            alert("Não há dados para exportar no período selecionado.");
            return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });

        const margem = 12;
        const agora = new Date().toLocaleString("pt-BR");

        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.text("ClimaJanaúba — Histórico de Dados", margem, 16);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.text(`Relatório gerado em: ${agora}`, margem, 23);
        doc.text(`Registros exportados: ${dadosExibidos.length}`, margem, 28);

        const periodoTexto = periodo.options[periodo.selectedIndex]?.text || "Período selecionado";
        const totalChuva = dadosExibidos.reduce((s, d) => s + Number(d.chuva ?? 0), 0);

        doc.text(`Período: ${periodoTexto}`, margem, 33);
        doc.text(`Chuva acumulada no período: ${totalChuva.toFixed(1)} mm`, margem, 38);

        const body = dadosExibidos.map(dado => [
            formatarData(dado.data),
            formatarNumero(dado.temperatura, 1),
            formatarNumero(dado.umidade, 0),
            formatarNumero(dado.pressao, 2),
            formatarNumero(dado.chuva, 1),
            determinarStatus(dado).texto
        ]);

        doc.autoTable({
            startY: 44,
            head: [["Data / Hora", "Temp. (°C)", "Umidade (%)", "Pressão (hPa)", "Chuva (mm)", "Status"]],
            body,
            theme: "grid",
            styles: { fontSize: 8, cellPadding: 2.5 },
            headStyles: { fillColor: [0, 110, 47], textColor: 255, fontStyle: "bold" },
            alternateRowStyles: { fillColor: [245, 243, 245] },
            margin: { left: margem, right: margem }
        });

        const pageCount = doc.internal.getNumberOfPages();
        for (let i = 1; i <= pageCount; i++) {
            doc.setPage(i);
            doc.setFontSize(8);
            doc.setTextColor(100);
            doc.text(
                `ClimaJanaúba • IFNMG Janaúba • Página ${i}/${pageCount}`,
                margem,
                205
            );
        }

        doc.save(`ClimaJanauba_Historico_${nomeArquivoData()}.pdf`);
    }

    btnFiltrar.addEventListener("click", aplicarFiltro);
    document.getElementById("btnExportarCSV").addEventListener("click", exportarCSV);
    document.getElementById("btnExportarPDF").addEventListener("click", exportarPDF);
</script>
